<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京东自动化平台</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20261111b">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>🤖 京东自动化平台</h1>
            <span class="device-status" id="deviceStatus">📱 设备未连接</span>
        </div>
    </header>

    <main class="main">
        <p class="page-hint">👇 点击任意模块卡片，或卡片上的【▶ 运行】按钮，即可启动对应任务</p>

        <section class="modules-grid" id="modulesGrid">
            <div class="grid-loading">正在加载任务模块…</div>
        </section>

        <section class="log-panel" id="logPanel" style="display:none;">
            <div class="log-header">
                <span id="logTitle">运行日志</span>
                <div class="log-actions">
                    <button class="btn btn-stop" id="btnStop" style="display:none;">⏹ 停止</button>
                    <button class="btn btn-close" id="btnCloseLog">✕</button>
                </div>
            </div>
            <div class="log-body" id="logBody">
                <div class="log-placeholder">选择一个模块开始运行...</div>
            </div>
        </section>
    </main>

    <script src="/static/js/app.js?v=20261111b"></script>
</body>
</html>
